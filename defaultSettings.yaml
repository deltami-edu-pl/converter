# 🧱 Ogólne ustawienia
defaultIndent: "  "  # dwie spacje jako wcięcie
preserveTrailingWhitespace: 0
removeTrailingWhitespace: 1
trailingComments: 1

onlyOneBackUp: 1

removeTrailingWhitespace:
  beforeProcessing: 0
  afterProcessing: 1

indentAfterItems:
    itemize: 1
    enumerate: 1
    description: 1
    list: 1

itemNames:
    item: 1
    myitem: 1
    marg: 1


indentRules:
  marg: "  "


modifyLineBreaks:
  preserveBlankLines: 1
  condenseMultipleBlankLinesInto: 1
  textWrapOptions:
    columns: 80


