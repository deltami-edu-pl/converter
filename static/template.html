<!DOCTYPE html>
<html>
  <head>
    <title>{{ title|default("Delta") }} - Delta</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <style>
      :root {
        --primary-color: #00aacc;
      }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <link href="static/article.css" media="all" rel="stylesheet" type="text/css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Are+You+Serious&pecial+Elite&Glass+Antiqua&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://deltami.edu.pl/static/css/base.css" rel="stylesheet" type="text/css" media="all" />
    <script type="text/javascript" src="https://deltami.edu.pl/static/js/jquery.js"></script>
    <script src="static/article.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js" type="text/javascript"></script>
  </head>
  <body class="article-page">
    <div class="header"></div>
    <div class="page">
      <article>
        <div class="article article-full">
          <div>
            <a class="article-issue-number" href=""></a>
            <h1><a class="article-title" href="">{{ title|default("") }}</a></h1>
            <div class="authors">
              <span class="author"><a href="">{{ author|default("") }}</a></span>
            </div>
          </div>
        </div>
        {{ content|safe }}
      </article>
    </div>
    <footer>
      <div class="footer">
        <div class="project">
          Projekt: <span>Redakcja <i>Delty</i></span>
        </div>
        <div class="implementation">Wykonanie: <span>Barbara Poszewiecka</span></div>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  </body>
</html>
